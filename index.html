function opt(en,hi){return {en,hi};}
function Q(cat,en,hi,options,correct,exp_en,exp_hi,matchTable,tip){
  return {cat,en,hi,options,correct,exp_en,exp_hi,matchTable:matchTable||null,tip:tip||null};
}
function stOpt(s){
  const n=s.split(",");
  if(n.length===4)return opt("1, 2, 3 and 4","1, 2, 3 और 4");
  const last=n.pop();
  const en=n.length?n.join(", ")+" and "+last+" only":last+" only";
  const hi=n.length?"केवल "+n.join(", ")+" और "+last:"केवल "+last;
  return opt(en,hi);
}
function SQ(cat,tEn,tHi,sEn,sHi,ans,correct,expEn,expHi,tip){
  const en=tEn+"<br>"+sEn.map((s,i)=>(i+1)+". "+s).join("<br>")+"<br>Which of the statements given above are correct?";
  const hi=tHi+"<br>"+sHi.map((s,i)=>(i+1)+". "+s).join("<br>")+"<br>उपर्युक्त में से कौन-से कथन सही हैं?";
  return Q(cat,en,hi,ans.map(stOpt),correct,expEn,expHi,null,tip);
}
function MQ(cat,tEn,tHi,left,right,ans,correct,expEn,expHi,tip){
  return Q(cat,tEn,tHi,ans.map(a=>opt(a.replace(/,/g,", "),a.replace(/,/g,", "))),correct,expEn,expHi,{left:left,right:right},tip);
}

SQ(BD,"Statements regarding Stomach Secretions and Digestion:","आमाशय के स्राव और पाचन के संबंध में कथन:",
 ["Oxyntic (Parietal) cells secrete Hydrochloric Acid (HCl) and Intrinsic Factor.","Pepsinogen is activated into active Pepsin by the action of HCl.","Mucus and Bicarbonates protect the stomach lining from excoriation by HCl.","Renin is a milk-protein digesting enzyme found in adult human stomach."],
 ["ऑक्सीन्टिक (पैराइटल) कोशिकाएं हाइड्रोक्लोरिक एसिड (HCl) और आंतरिक कारक स्रावित करती हैं।","पेप्सिनोजेन, HCl की क्रिया द्वारा सक्रिय पेप्सिन में परिवर्तित होता है।","श्लेष्मा (Mucus) और बाइकार्बोनेट आमाशय की परत को HCl के कटाव से बचाते हैं।","रेनिन वयस्क मानव आमाशय में पाया जाने वाला दूध-प्रोटीन पाचन एंजाइम है।"],
 ["1,2,3","2,4","1,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because Rennin, the milk-protein digesting enzyme, is present in the gastric juice of infants but absent or negligible in human adults.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि दूध-पाचक एंजाइम रेन्निन (Rennin) केवल शिशुओं के जठर रस में पाया जाता है, वयस्कों में यह अनुपस्थित या नगण्य होता है।",
 "Rennin → infants only; adults use pepsin."),

SQ(BD,"Statements regarding Liver and Bile Juice:","यकृत और पित्त रस के संबंध में कथन:",
 ["Bile juice contains digestive enzymes like lipase and trypsin.","Bile salts help in the emulsification of fats.","Bile juice activates pancreatic lipases in the small intestine.","Bilirubin and Biliverdin are the primary bile pigments."],
 ["पित्त रस में लाइपेस और ट्रिप्सिन जैसे पाचक एंजाइम होते हैं।","पित्त लवण वसा के इमल्सीकरण (Emulsification) में मदद करते हैं।","पित्त रस छोटी आंत में अग्न्याशयी लाइपेस को सक्रिय करता है।","बिलीरुबिन और बिलीवर्डिन प्राथमिक पित्त वर्णक हैं।"],
 ["2,3,4","1,2","1,3","1,2,3,4"],0,
 "Statements 2, 3 and 4 are correct. Statement 1 is incorrect because bile juice contains no digestive enzymes; it only emulsifies fats and activates lipases.",
 "कथन 2, 3 और 4 सही हैं। कथन 1 गलत है क्योंकि पित्त रस में कोई पाचक एंजाइम नहीं होता; यह केवल वसा का इमल्सीकरण करता है।",
 "Bile = no enzymes, but essential for fat digestion."),

SQ(BD,"Statements regarding Pancreatic Juice:","अग्न्याशयी रस के संबंध में कथन:",
 ["Trypsinogen is converted into active Trypsin by Enterokinase.","Pancreatic juice contains inactive enzymes: Trypsinogen, Chymotrypsinogen, and Procarboxypeptidase.","Enterokinase is secreted by the pancreatic acinar cells.","Activated Trypsin activates other inactive enzymes in pancreatic juice."],
 ["ट्रिप्सिनोजेन को एंटरोकाइनेज द्वारा सक्रिय ट्रिप्सिन में बदला जाता है।","अग्न्याशयी रस में निष्क्रिय एंजाइम: ट्रिप्सिनोजेन, काइमोट्रिप्सिनोजेन और प्रोकार्बोक्सीपेप्टिडेज होते हैं।","एंटरोकाइनेज का स्राव अग्न्याशय की एसिनर कोशिकाओं द्वारा होता है।","सक्रिय ट्रिप्सिन अग्न्याशयी रस के अन्य निष्क्रिय एंजाइमों को सक्रिय करता है।"],
 ["1,2,4","2,3","1,3","1,2,3,4"],0,
 "Statements 1, 2 and 4 are correct. Statement 3 is incorrect because Enterokinase is secreted by the intestinal mucosa, not by pancreatic acinar cells.",
 "कथन 1, 2 और 4 सही हैं। कथन 3 गलत है क्योंकि एंटरोकाइनेज (Enterokinase) आंत्र म्यूकोसा द्वारा स्रावित होता है, अग्न्याशय द्वारा नहीं।",
 "Enterokinase: intestinal mucosa → Trypsinogen → Trypsin."),

SQ(BD,"Statements regarding Absorption in the Small Intestine:","छोटी आंत में अवशोषण के संबंध में कथन:",
 ["Villi and Microvilli greatly increase the surface area for absorption.","Glucose and Amino acids are absorbed primarily by simple diffusion only.","Fatty acids and Glycerol are absorbed into Lacteals as Chylomicrons.","Small intestine is the principal organ for absorption of digested nutrients."],
 ["विली और माइक्रोविली अवशोषण के लिए सतह के क्षेत्रफल को अत्यधिक बढ़ाते हैं।","ग्लूकोज और अमीनो एसिड मुख्य रूप से केवल सरल विसरण द्वारा अवशोषित होते हैं।","वसा अम्ल और ग्लिसरॉल काइलोमाइक्रोन के रूप में लैक्टियल्स (Lacteals) में अवशोषित होते हैं।","छोटी आंत पचे हुए पोषक तत्वों के अवशोषण का मुख्य अंग है।"],
 ["1,3,4","1,2","2,4","1,2,3,4"],0,
 "Statements 1, 3 and 4 are correct. Statement 2 is incorrect because glucose and amino acids are absorbed via facilitated diffusion and active transport, not simple diffusion alone.",
 "कथन 1, 3 और 4 सही हैं। कथन 2 गलत है क्योंकि ग्लूकोज और अमीनो एसिड का अवशोषण सुसाध्य विसरण तथा सक्रिय परिवहन (Active transport) द्वारा होता है।",
 "Fats → lacteals (lymph); glucose/amino acids → blood capillaries."),

SQ(BD,"Statements regarding Fat Soluble and Water Soluble Vitamins:","वसा-घुलनशील और जल-घुलनशील विटामिनों के संबंध में कथन:",
 ["Vitamins A, D, E, and K are fat-soluble vitamins.","Vitamin C and B-complex vitamins are water-soluble vitamins.","Vitamin B12 is stored in the human liver for several years.","Excess water-soluble vitamins are readily stored in adipose tissue."],
 ["विटामिन A, D, E और K वसा-घुलनशील विटामिन हैं।","विटामिन C और B-कॉम्प्लेक्स विटामिन जल-घुलनशील विटामिन हैं।","विटामिन B12 मानव यकृत में कई वर्षों तक संग्रहीत रहता है।","अत्यधिक जल-घुलनशील विटामिन एडिपोज ऊतक में आसानी से संग्रहीत होते हैं।"],
 ["1,2,3","1,4","2,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because water-soluble vitamins (except B12) are not stored in the body and are excreted in urine.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि जल-घुलनशील विटामिन (B12 को छोड़कर) शरीर में संचित नहीं होते और मूत्र के साथ बाहर निकल जाते हैं।",
 "Fat-soluble: A D E K (stored). Water-soluble: B & C (excreted; B12 exception)."),

SQ(BD,"Statements regarding Human Teeth Structure and Dental Formula:","मानव दांतों की संरचना और दंत सूत्र के संबंध में कथन:",
 ["Adult human dental formula is 2123 / 2123.","Human dentition is Thecodont, Diphyodont, and Heterodont.","Enamel is the hardest chewing surface of teeth, made of calcium phosphate.","Milk teeth in human children include 8 Premolars."],
 ["वयस्क मानव का दंत सूत्र 2123 / 2123 होता है।","मानव दंतविन्यास थीकोडॉन्ट, डिफीओडॉन्ट और हेटेरोडॉन्ट होता है।","इनेमल दांतों की सबसे कठोर सतह है, जो कैल्शियम फॉस्फेट से बनी होती है।","मानव बच्चों में दूध के दांतों में 8 अग्रचर्वणक (Premolars) शामिल होते हैं।"],
 ["1,2,3","1,4","3,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because Premolars are completely absent in the primary (milk) dentition of human children (formula 2102 / 2102).",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि बच्चों के दूध के दांतों (2102 / 2102) में अग्रचर्वणक (Premolars) अनुपस्थित होते हैं।",
 "Adult: 32 teeth (2123); milk teeth: 20 (2102)."),

SQ(BD,"Statements regarding Functions of the Large Intestine:","बड़ी आंत के कार्यों के संबंध में कथन:",
 ["Significant digestion of proteins and carbohydrates occurs in the colon.","Large intestine absorbs water, minerals, and certain drugs.","Mucus secreted by large intestine lubricates waste for easy passage.","Symbiotic bacteria in colon synthesize Vitamin K and some B-complex vitamins."],
 ["कोलन में प्रोटीन और कार्बोहाइड्रेट का महत्वपूर्ण पाचन होता है।","बड़ी आंत जल, खनिजों और कुछ दवाओं का अवशोषण करती है।","बड़ी आंत द्वारा स्रावित श्लेष्मा अपशिष्ट को सुगम निकास के लिए चिकना बनाती है।","कोलन में सहजीवी जीवाणु विटामिन K और कुछ B-कॉम्प्लेक्स विटामिन का संश्लेषण करते हैं।"],
 ["2,3,4","1,2","1,3","1,2,3,4"],0,
 "Statements 2, 3 and 4 are correct. Statement 1 is incorrect because no significant digestive activity occurs in the large intestine.",
 "कथन 2, 3 और 4 सही हैं। कथन 1 गलत है क्योंकि बड़ी आंत में कोई महत्वपूर्ण पाचक क्रिया नहीं होती।",
 "Large intestine = absorption of water + bacterial vitamin K, not digestion."),

SQ(BD,"Statements regarding Nutritional Disorders:","पोषण संबंधी विकारों के संबंध में कथन:",
 ["Kwashiorkor is caused by severe deficiency of proteins accompanied by calorie deficiency.","Marasmus is caused by simultaneous deficiency of proteins and total calories in infants under 1 year.","Oedema and swelling of body parts is characteristically seen in Kwashiorkor.","Extensive tissue protein loss and extreme emaciation occurs in Marasmus."],
 ["क्वाशियोरकोर कैलोरी की कमी के साथ प्रोटीन की गंभीर कमी के कारण होता है।","मरास्मस 1 वर्ष से कम उम्र के शिशुओं में प्रोटीन और कुल कैलोरी दोनों की कमी से होता है।","शरीर के अंगों में सूजन (Oedema) विशिष्ट रूप से क्वाशियोरकोर में देखी जाती है।","मरास्मस में व्यापक ऊतक प्रोटीन का नुकसान और अत्यधिक दुबलापन होता है।"],
 ["2,3,4","1,2","1,3","1,2,3,4"],0,
 "Statements 2, 3 and 4 are correct. Statement 1 is incorrect because Kwashiorkor is caused by protein deficiency without calorie deficiency, whereas Marasmus results from combined protein and calorie deficiency.",
 "कथन 2, 3 और 4 सही हैं। कथन 1 गलत है क्योंकि क्वाशियोरकोर केवल प्रोटीन की कमी से होता है (बिना कैलोरी कमी के), जबकि मरास्मस प्रोटीन और कैलोरी दोनों की कमी से होता है।",
 "Kwashiorkor = protein only (oedema); Marasmus = protein + calories (emaciation)."),

SQ(BD,"Statements regarding Gastrointestinal Hormones:","जठरांत्र संबंधी हार्मोन के संबंध में कथन:",
 ["Gastrin stimulates the secretion of HCl and Pepsinogen from gastric glands.","Secretin acts on exocrine pancreas and stimulates secretion of water and bicarbonate ions.","Cholecystokinin (CCK) stimulates the contraction of gallbladder to release bile.","Gastric Inhibitory Peptide (GIP) accelerates gastric secretion and motility."],
 ["गैस्ट्रिन जठर ग्रंथियों से HCl और पेप्सिनोजेन के स्राव को उत्तेजित करता है।","सिक्रेटिन बाह्यस्रावी अग्न्याशय पर कार्य करता है और जल व बाइकार्बोनेट आयनों के स्राव को उत्तेजित करता है।","कोलेसिस्टोकाइनिन (CCK) पित्ताशय को संकुचित करके पित्त रस जारी करने के लिए उत्तेजित करता है।","गैस्ट्रिक इनहिबिटरी पेप्टाइड (GIP) जठरीय स्राव और गतिशीलता को तेज करता है।"],
 ["1,2,3","1,4","2,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because GIP inhibits gastric secretion and motility, rather than accelerating it.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि GIP जठरीय स्राव और गतिशीलता को संदमित (Inhibit) करता है, तेज नहीं करता।",
 "GIP = Gastric INHIBITORY peptide → inhibits."),

SQ(BD,"Statements regarding Vitamin Deficiency Diseases:","विटामिन की कमी से होने वाले रोगों के संबंध में कथन:",
 ["Deficiency of Vitamin B1 (Thiamine) leads to Beriberi.","Deficiency of Vitamin C (Ascorbic acid) causes Scurvy with bleeding gums.","Deficiency of Vitamin D causes Rickets in children and Osteomalacia in adults.","Deficiency of Vitamin E causes Pernicious Anaemia."],
 ["विटामिन B1 (थायामिन) की कमी से बेरीबेरी रोग होता है।","विटामिन C (एस्कॉर्बिक एसिड) की कमी से मसूड़ों से खून बहने वाला स्कर्वी रोग होता है।","विटामिन D की कमी से बच्चों में रिकेट्स और वयस्कों में ऑस्टियोमलेशिया होता है।","विटामिन E की कमी से परनिशियस एनीमिया (घातक रक्ताल्पता) होता है।"],
 ["1,2,3","1,4","2,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because Pernicious Anaemia is caused by Vitamin B12 deficiency.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि परनिशियस एनीमिया विटामिन B12 की कमी से होता है।",
 "Pernicious anaemia = B12 (needs Intrinsic Factor)."),

SQ(BD,"Statements regarding Mineral Nutrition in Humans:","मानव में खनिज पोषण के संबंध में कथन:",
 ["Iron is an essential constituent of Hemoglobin and Myoglobin.","Iodine is required for the synthesis of Thyroid hormones (T3 and T4).","Calcium and Phosphorus are required for bone and tooth formation.","Sodium and Potassium play no role in nerve impulse transmission."],
 ["आयरन हीमोग्लोबिन और मायोग्लोबिन का एक अनिवार्य घटक है।","आयोडीन थायराइड हार्मोन (T3 और T4) के संश्लेषण के लिए आवश्यक है।","कैल्शियम और फास्फोरस हड्डियों और दांतों के निर्माण के लिए आवश्यक है।","सोडियम और पोटेशियम तंत्रिका आवेग संचरण में कोई भूमिका नहीं निभाते हैं।"],
 ["1,2,3","1,4","2,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because Sodium and Potassium play vital roles in nerve impulse transmission.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि सोडियम और पोटेशियम तंत्रिका आवेग संचरण (Nerve impulse transmission) में महत्वपूर्ण भूमिका निभाते हैं।",
 "Na⁺/K⁺ pump → nerve impulse."),

SQ(BD,"Statements regarding Peristalsis and Deglutition:","क्रमाकुंचन (Peristalsis) और निगलने (Deglutition) के संबंध में कथन:",
 ["Deglutition refers to the swallowing of food bolus from mouth into esophagus.","Peristalsis involves alternate wave-like contraction and relaxation of gut muscles.","Epiglottis prevents the entry of food into the larynx during swallowing.","Significant chemical digestion of food takes place inside the Esophagus."],
 ["निगलने (Deglutition) का अर्थ भोजन के बोलस को मुंह से ग्रसिका में ले जाना है।","क्रमाकुंचन में आहारनाल की मांसपेशियों का वैकल्पिक तरंग-समान संकुचन और शिथिलन शामिल है।","एपिग्लॉटिस निगलने के दौरान भोजन को स्वरयंत्र (Larynx) में प्रवेश करने से रोकता है।","ग्रसिका (Esophagus) के भीतर भोजन का महत्वपूर्ण रासायनिक पाचन होता है।"],
 ["1,2,3","1,4","2,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because no digestive enzymes are secreted in the esophagus.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि ग्रसिका (Esophagus) में कोई पाचक एंजाइम स्रावित नहीं होता।",
 "Esophagus = transport only (peristalsis), no enzyme secretion."),

MQ(BD,"Match List-I (Digestive Enzyme) with List-II (Substrate / Product):","सूची-I (पाचक एंजाइम) को सूची-II (क्रियाधार / उत्पाद) से सुमेलित करें:",
 ["A. Salivary Amylase / टायलीन","B. Pepsin / पेप्सिन","C. Rennin / रेन्निन","D. Steapsin (Pancreatic Lipase) / स्टीएप्सिन"],
 ["1. Converts Milk casein into Paracasein / दूध के केसीन को पैराकेसीन में बदलना","2. Hydrolyzes Starch into Maltose / स्टार्च को माल्टोज में अपघटित करना","3. Converts Proteins into Peptones / प्रोटीन को पेप्टोन्स में बदलना","4. Hydrolyzes Triglycerides into Fatty acids & Glycerol / ट्राइग्लिसराइड्स का अपघटन"],
 ["A-2,B-3,C-1,D-4","A-1,B-2,C-3,D-4","A-2,B-1,C-4,D-3","A-4,B-3,C-2,D-1"],0,
 "Salivary Amylase hydrolyzes starch into maltose (A-2); Pepsin converts proteins into peptones (B-3); Rennin curdles milk casein (C-1); Steapsin breaks down lipids into fatty acids and glycerol (D-4).",
 "टायलीन स्टार्च को माल्टोज में तोड़ता है (A-2); पेप्सिन प्रोटीन को पेप्टोन्स में बदलता है (B-3); रेन्निन दूध के केसीन को जमाता है (C-1); अग्न्याशयी लाइपेस वसा को फैटी एसिड/ग्लिसरॉल में तोड़ता है (D-4)।",

MQ(BD,"Match List-I (Vitamin Chemical Name) with List-II (Deficiency Disease):","सूची-I (विटामिन का रासायनिक नाम) को सूची-II (कमी से होने वाला रोग) से सुमेलित करें:",

 ["A-3,B-1,C-2,D-4","A-1,B-2,C-3,D-4","A-3,B-2,C-1,D-4","A-4,B-3,C-2,D-1"],0,
 "Dhupgarh lies in the Mahadeo / Satpura Hills (A-3); Anamudi in the Anaimalai Hills (B-1); Guru Shikhar in the Aravalli Range (C-2); Nokrek in the Garo Hills (D-4).",
 "धूपगढ़ महादेव/सतपुड़ा पहाड़ियों में (A-3); अनामुडी अन्नामलाई पहाड़ियों में (B-1); गुरु शिखर अरावली श्रेणी में (C-2); नोकरेक गारो पहाड़ियों में (D-4) स्थित है।",
 "Nokrek = Garo Hills, Meghalaya."),

MQ(PK,"Match List-I (State) with List-II (Highest Mountain Peak):","सूची-I (राज्य) को सूची-II (सबसे ऊंची पर्वत चोटी) से सुमेलित करें:",
 ["A. Nagaland / नागालैंड","B. Mizoram / मिजोरम","C. Himachal Pradesh / हिमाचल प्रदेश","D. Kerala / केरल"],
 ["1. Phawngpui (Blue Mountain) / फावंगपुई","2. Reo Purgyil / रियो पुरग्युल","3. Saramati / सारामाटी","4. Anamudi / अनामुडी"],
 ["A-3,B-1,C-2,D-4","A-1,B-2,C-3,D-4","A-3,B-2,C-1,D-4","A-2,B-4,C-3,D-1"],0,
 "Nagaland's highest peak is Saramati (A-3); Mizoram's is Phawngpui / Blue Mountain (B-1); Himachal Pradesh's is Reo Purgyil (C-2); Kerala's is Anamudi (D-4).",
 "नागालैंड की सबसे ऊंची चोटी सारामाटी है (A-3); मिजोरम की सबसे ऊंची चोटी फावंगपुई/ब्लू माउंटेन है (B-1); हिमाचल प्रदेश की सबसे ऊंची चोटी रियो पुरग्युल है (C-2); केरल की सबसे ऊंची चोटी अनामुडी है (D-4)।",
 "State-wise highest peaks are frequent exam questions."),

P(PK,"Which peak is known as the highest mountain peak of the Eastern Ghats in India?","भारत में पूर्वी घाट की सबसे ऊंची पर्वत चोटी के रूप में किसे जाना जाता है?",["Mahendragiri / महेंद्रगिरि","Jindhagada Peak / जिंदगड़ा चोटी","Arma Konda / अरमा कोंडा","Anamudi / अनामुडी"],1,
 "Jindhagada Peak (1,690 m), located in the Araku Valley of Andhra Pradesh, is the highest peak of the Eastern Ghats. Mahendragiri (1,501 m) in Odisha is the second highest.",
 "जिंदगड़ा चोटी (1,690 मीटर), जो आंध्र प्रदेश की अराकू घाटी में स्थित है, पूर्वी घाट की सबसे ऊंची पर्वत चोटी है। महेंद्रगिरि (1,501 मीटर) ओडिशा में स्थित दूसरी सबसे ऊंची चोटी है।",
 "Eastern Ghats: Jindhagada (AP) 1st, Mahendragiri (Odisha) 2nd."),

P(PK,"Phawngpui, also known as the 'Blue Mountain', is the highest peak of which Indian state?","'ब्लू माउंटेन' के नाम से प्रसिद्ध फावंगपुई किस भारतीय राज्य की सबसे ऊंची चोटी है?",["Meghalaya / मेघालय","Manipur / मणिपुर","Mizoram / मिजोरम","Tripura / त्रिपुरा"],2,
 "Phawngpui (2,157 m) is the highest peak of Mizoram, known locally and administratively as the 'Blue Mountain'.",
 "फावंगपुई (2,157 मीटर) मिजोरम की सबसे ऊंची पर्वत चोटी है, जिसे स्थानीय स्तर पर और प्रशासनिक रूप से 'ब्लू माउंटेन' के नाम से जाना जाता है।",
 "Mizoram = Phawngpui (Blue Mountain)."),

P(PK,"What is the elevation/height of Nanda Devi Peak, the highest peak located entirely within India?","पूरी तरह से भारत के भीतर स्थित सबसे ऊंची चोटी नंदा देवी की ऊंचाई कितनी है?",["8,586 m","7,816 m","8,611 m","7,756 m"],1,
 "Nanda Devi Peak is 7,816 m high. It is located in Chamoli district, Uttarakhand, and is the highest peak entirely within Indian borders.",
 "नंदा देवी चोटी की ऊंचाई 7,816 मीटर है। यह उत्तराखंड के चमोली जिले में स्थित है और पूरी तरह से भारतीय सीमा में स्थित सर्वोच्च चोटी है।",
 "Kangchenjunga 8,586 m (border) vs Nanda Devi 7,816 m (entirely in India)."),

SQ(IND,"Statements regarding the Iron and Steel Industry in India:","भारत में लौह एवं इस्पात उद्योग के संबंध में कथन:",
 ["TISCO (Tata Iron and Steel Company) at Jamshedpur was established in 1907 as the first private sector steel plant.","Bhilai Steel Plant was set up in Chhattisgarh with technical assistance from the USSR.","Rourkela Steel Plant in Odisha was established with collaboration from West Germany.","Durgapur Steel Plant in West Bengal was built with collaboration from Russia."],
 ["जमशेदपुर में TISCO की स्थापना 1907 में पहले निजी क्षेत्र के इस्पात संयंत्र के रूप में हुई थी।","भिलाई इस्पात संयंत्र की स्थापना छत्तीसगढ़ में सोवियत संघ (USSR) की तकनीकी सहायता से की गई थी।","ओडिशा में राउरकेला इस्पात संयंत्र की स्थापना पश्चिम जर्मनी के सहयोग से की गई थी।","पश्चिम बंगाल में दुर्गापुर इस्पात संयंत्र की स्थापना रूस के सहयोग से की गई थी।"],
 ["1,2,3","1,4","2,3","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because the Durgapur Steel Plant was established with the collaboration of Britain (United Kingdom), not Russia.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि दुर्गापुर इस्पात संयंत्र ब्रिटेन (United Kingdom) के सहयोग से स्थापित किया गया था, न कि रूस के सहयोग से।",
 "Bhilai–USSR · Rourkela–W. Germany · Durgapur–UK · Bokaro–USSR."),

SQ(IND,"Statements regarding the Cotton Textile Industry in India:","भारत में सूती वस्त्र उद्योग के संबंध में कथन:",
 ["The first successful modern cotton textile mill was established in Mumbai in 1854.","Mumbai is known as the 'Cottonopolis of India' due to high concentration of mills.","Ahmedabad is widely known as the 'Manchester of India'.","Coimbatore is popularly known as the 'Manchester of North India'."],
 ["भारत की पहली सफल आधुनिक सूती वस्त्र मिल 1854 में मुंबई में स्थापित की गई थी।","सूती वस्त्र मिलों के उच्च संकेंद्रण के कारण मुंबई को 'कॉटनोपोलिस ऑफ इंडिया' कहा जाता है।","अहमदाबाद को 'भारत का मैनचेस्टर' कहा जाता है।","कोयंबटूर को 'उत्तर भारत का मैनचेस्टर' कहा जाता है।"],
 ["1,2,3","1,4","2,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because Coimbatore is called the 'Manchester of South India'; the 'Manchester of North India' is Kanpur.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि कोयंबटूर को 'दक्षिण भारत का मैनचेस्टर' कहा जाता है; 'उत्तर भारत का मैनचेस्टर' कानपुर को कहा जाता है।",
 "Coimbatore = South; Kanpur = North."),

SQ(IND,"Statements regarding the Fertilizer Industry in India:","भारत में उर्वरक उद्योग के संबंध में कथन:",
 ["The first superphosphate fertilizer plant in India was set up at Ranipet (Tamil Nadu) in 1906.","FCI (Fertilizer Corporation of India) set up its major plant at Sindri (Jharkhand) in 1951.","India is completely self-sufficient in Potash fertilizers and imports none.","Hazira-Vijaipur-Jagdishpur (HVJ) pipeline supplies natural gas to key fertilizer plants."],
 ["भारत में पहला सुपरफॉस्फेट उर्वरक संयंत्र 1906 में रानीपेट (तमिलनाडु) में स्थापित किया गया था।","सिंदरी (झारखंड) में एफसीआई का प्रमुख उर्वरक संयंत्र 1951 में स्थापित किया गया था।","भारत पोटाश उर्वरकों में पूरी तरह से आत्मनिर्भर है और इसका आयात नहीं करता है।","हजीरा-विजयपुर-जगदीशपुर (HVJ) पाइपलाइन प्रमुख उर्वरक संयंत्रों को प्राकृतिक गैस की आपूर्ति करती है।"],
 ["1,2,4","1,3","3,4","1,2,3,4"],0,
 "Statements 1, 2 and 4 are correct. Statement 3 is incorrect because India has no commercial reserves of potash (K), so India is 100% dependent on imports for potash fertilizers.",
 "कथन 1, 2 और 4 सही हैं। कथन 3 गलत है क्योंकि भारत में पोटाश (K) का कोई व्यावसायिक भंडार नहीं है, इसलिए भारत पोटाश उर्वरकों के लिए 100% आयात पर निर्भर है।",
 "India: potash 100% imported."),

SQ(IND,"Statements regarding Aluminium Smelting and Sugar Industry:","एल्युमीनियम स्मेल्टिंग और चीनी उद्योग के संबंध में कथन:",
 ["Bauxite is the primary raw material used for the production of aluminium.","Availability of continuous, cheap electricity is a major factor in locating aluminium plants.","In recent years, sugar industry has been shifting towards South India due to higher sucrose content in sugarcane.","Sugarcane is a weight-gaining raw material that can be transported over long distances without loss."],
 ["बॉक्साइट एल्युमीनियम के उत्पादन के लिए उपयोग किया जाने वाला प्राथमिक कच्चा माल है।","निरंतर और सस्ती बिजली की उपलब्धता एल्युमीनियम संयंत्र स्थापित करने का एक मुख्य कारक है।","हाल के वर्षों में गन्ने में सुक्रोज की उच्च मात्रा के कारण चीनी उद्योग दक्षिण भारत की ओर स्थानांतरित हो रहा है।","गन्ना वजन बढ़ाने वाला कच्चा माल है जिसे बिना किसी नुकसान के लंबी दूरी तक ले जाया जा सकता है।"],
 ["1,2,3","1,4","2,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because sugarcane is a weight-losing and perishable raw material that needs crushing immediately after harvesting.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि गन्ना एक वजन घटाने वाला (weight-losing) तथा नाशवान कच्चा माल है, जिसे काटने के तुरंत बाद पेराई की आवश्यकता होती है।",
 "Sugarcane loses weight & sucrose after cutting → mills near fields."),

SQ(IND,"Statements regarding Industrial Regions of India:","भारत के औद्योगिक प्रदेशों के संबंध में कथन:",
 ["The Hugli Industrial Region developed around the jute and tea industries and Kolkata port.","The Mumbai-Pune Industrial Region is famous for textiles, chemicals, and engineering goods.","Chota Nagpur Industrial Region is known as the 'Ruhr of India' due to rich mineral wealth.","Bengaluru-Tamil Nadu Industrial Region relies primarily on coal reserves located within Karnataka."],
 ["हुगली औद्योगिक प्रदेश का विकास जूट व चाय उद्योग तथा कोलकाता बंदरगाह के आसपास हुआ।","मुंबई-पुणे औद्योगिक प्रदेश सूती वस्त्र, रसायन और इंजीनियरिंग सामान के लिए प्रसिद्ध है।","खनिज संपन्नता के कारण छोटानागपुर औद्योगिक प्रदेश को 'भारत का रूर' कहा जाता है।","बेंगलुरु-तमिलनाडु औद्योगिक प्रदेश मुख्य रूप से कर्नाटक में स्थित कोयला भंडारों पर निर्भर है।"],
 ["1,2,3","2,4","1,4","1,2,3,4"],0,
 "Statements 1, 2 and 3 are correct. Statement 4 is incorrect because Karnataka has no coal reserves; this region mainly depends on the Sharavati and Pykara hydel projects.",
 "कथन 1, 2 और 3 सही हैं। कथन 4 गलत है क्योंकि कर्नाटक में कोयले के भंडार नहीं हैं; यह क्षेत्र मुख्यतः शरावती व पाइकारा जलविद्युत परियोजनाओं पर निर्भर है।",
 "Chota Nagpur = 'Ruhr of India'."),

MQ(IND,"Match List-I (Steel Plant) with List-II (Assisting Foreign Country / Entity):","सूची-I (इस्पात संयंत्र) को सूची-II (सहायक विदेशी देश) से सुमेलित करें:",
 ["A. Bhilai / भिलाई","B. Rourkela / राउरकेला","C. Durgapur / दुर्गापुर","D. Bokaro / बोकारो"],

 "Bhilai (Chhattisgarh) was built with USSR help (A-2); Rourkela (Odisha) with West Germany's help (B-3); Durgapur (West Bengal) with Britain's help (C-1); Bokaro (Jharkhand) with USSR help (D-4).",
 "भिलाई (छत्तीसगढ़) सोवियत संघ के सहयोग से बना (A-2); राउरकेला (ओडिशा) पश्चिम जर्मनी के सहयोग से बना (B-3); दुर्गापुर (पश्चिम बंगाल) ब्रिटेन के सहयोग से बना (C-1); बोकारो (झारखंड) सोवियत संघ के सहयोग से बना (D-4)।",
 "Mnemonic: Bhilai-Russia, Rourkela-Germany, Durgapur-Britain."),

MQ(IND,"Match List-I (Industrial City) with List-II (Associated Main Industry):","सूची-I (औद्योगिक शहर) को सूची-II (संबंधित मुख्य उद्योग) से सुमेलित करें:",

MQ(IND,"Match List-I (Industrial Title / Nickname) with List-II (Indian City / Region):","सूची-I (औद्योगिक उपनाम) को सूची-II (भारतीय शहर / क्षेत्र) से सुमेलित करें:",
 ["A. Detroit of Asia / एशिया का डेट्रॉयट","B. Manchester of South India / दक्षिण भारत का मैनचेस्टर","C. Manchester of North India / उत्तर भारत का मैनचेस्टर","D. Boston of India / भारत का बोस्टन"],

 "ऑटोमोबाइल हब होने के कारण चेन्नई को 'एशिया का डेट्रॉयट' कहते हैं (A-2); कोयंबटूर को 'दक्षिण भारत का मैनचेस्टर' कहते हैं (B-3); कानपुर को 'उत्तर भारत का मैनचेस्टर' कहते हैं (C-4); अहमदाबाद को 'भारत का बोस्टन' कहा जाता है (D-1)।",
 "Nicknames are favourites in Bihar Police / BPSC papers."),

P(IND,"Where was the first modern paper mill in India successfully established in 1870?","1870 में भारत की पहली सफल आधुनिक पेपर मिल कहाँ स्थापित की गई थी?",["Serampore / श्रीरामपुर","Ballygunge / बालीगंज","Nepanagar / नेपानगर","Titagarh / टीटागढ़"],1,
 "The first successful modern paper mill in India was established in 1870 at Ballygunge (near Calcutta, West Bengal). Later mills followed at Lucknow in 1881 and Titagarh in 1882.",

const MOTIVATE=["ध्यान से सोचिए… इसमें एक ट्रैप है! 👀","जवाब लॉक करने से पहले अच्छी तरह सोच लें! 🔒","जल्दबाजी न करें—हर विकल्प ध्यान से पढ़ें! 🎯","दिमाग लगाइए, यह सवाल आपकी परीक्षा में आ सकता है! 💪","एक गहरी सांस लें और ध्यान से पढ़ें! 🧘"];
function shuffleTag(arr,i){return arr[i % arr.length];}

const state={idx:0,score:0,correctCount:0,wrongCount:0,answered:false,timer:null,timeLeft:TOTAL_TIME,name:""};
const app=document.getElementById('app');

function renderStart(){
  app.innerHTML=`
    <div class="hero">
      <div class="tagline">🎮 GAME-SHOW QUIZ CHALLENGE 🎮</div>
      <h1>ROUTINE-9</h1>
      <p>Daroga / Police / BPSC / BSSC · Bilingual Game-Show Quiz · ${QUESTIONS.length} Questions</p>
    </div>
    <div class="card">
      <p style="color:var(--dim);font-size:14px;margin-bottom:10px;">Enter your name to begin / शुरू करने के लिए अपना नाम दर्ज करें:</p>
      <input type="text" id="nameInput" placeholder="Your Name / आपका नाम" />
      <div class="center"><button class="btn" id="startBtn">🚀 Start Quiz / शुरू करें</button></div>
    </div>
    <div class="card" style="font-size:13px;color:var(--dim);line-height:1.6;">
      📚 Topics: Modern History, Human Digestion &amp; Nutrition, Mountain Peaks, Indian Industries, Biodiversity Hotspots, Sports Terms<br>
      ⏱️ ${TOTAL_TIME} seconds per question &nbsp;|&nbsp; 🏆 Scoreboard every 10 questions
    </div>
  `;
  document.getElementById('startBtn').onclick=()=>{
    state.name=document.getElementById('nameInput').value.trim()||"Champion";
    renderQuestion();
  };
}

function renderQuestion(){
  if(state.idx>=QUESTIONS.length){renderFinal();return;}
  const q=QUESTIONS[state.idx];
  state.answered=false;
  state.timeLeft=TOTAL_TIME;
  let matchHtml="";
  if(q.matchTable){
    matchHtml=`<div class="matchbox">
      <div class="matchcol"><h4>List-I</h4>${q.matchTable.left.map(x=>`<div class="matchrow">${x}</div>`).join('')}</div>
      <div class="matchcol"><h4>List-II</h4>${q.matchTable.right.map(x=>`<div class="matchrow">${x}</div>`).join('')}</div>
    </div>`;
  }
  app.innerHTML=`
    <div class="scorebar"><span>Q ${state.idx+1} / ${QUESTIONS.length}</span><span>Score: <b>${state.score}</b></span></div>
    <div class="card">
      <div class="taghead">
        <span class="tagline">${shuffleTag(TAGLINES,state.idx)}</span>
        <span class="cat-tag">${q.cat}</span>
      </div>
      <div class="timer-wrap"><div class="timer-ring" id="ring" style="--pct:100"><div class="timer-inner" id="timerNum">${TOTAL_TIME}</div></div></div>
      <p class="motivate">${shuffleTag(MOTIVATE,state.idx)}</p>
      <div class="qtext">${q.en}<br><br><b>प्र.</b> ${q.hi}</div>
      ${matchHtml}
      <div class="options" id="optionsWrap">
        ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o.en} / ${o.hi}</button>`).join('')}
      </div>
      <div id="resultBox"></div>
      <div class="next-row" id="nextRow" style="display:none;"><button class="btn" id="nextBtn">Next Question ➡️</button></div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>selectAnswer(parseInt(btn.dataset.i));
  });
  startTimer();
}

function startTimer(){
  clearInterval(state.timer);
  const ring=document.getElementById('ring');
  const numEl=document.getElementById('timerNum');
  state.timer=setInterval(()=>{
    state.timeLeft--;
    const pct=Math.max(0,(state.timeLeft/TOTAL_TIME)*100);
    if(ring){ring.style.setProperty('--pct',pct);}
    if(numEl){numEl.textContent=Math.max(0,state.timeLeft);}
    if(ring && pct<20){ring.classList.add('warn');}
    if(state.timeLeft<=0 && !state.answered){
      selectAnswer(-1);
    }
  },1000);
}

function selectAnswer(choice){
  if(state.answered)return;
  state.answered=true;
  clearInterval(state.timer);
  const q=QUESTIONS[state.idx];
  const opts=document.querySelectorAll('.opt');
  opts.forEach(b=>b.setAttribute('disabled','true'));
  const isCorrect=choice===q.correct;
  if(isCorrect){
    state.score+=10;
    state.correctCount++;
    opts[choice].classList.add('correct');
  }else{
    state.wrongCount++;
    if(choice>=0)opts[choice].classList.add('wrong');
    opts[q.correct].classList.add('correct');
  }
  const resultBox=document.getElementById('resultBox');
  const tipHtml=q.tip?`<p>💡 <b>Exam Tip:</b> ${q.tip}</p>`:"";
  if(isCorrect){
    resultBox.innerHTML=`<div class="result ok"><h3>🎉 CORRECT! 🔥</h3><p>🏆 Correct Answer: ${String.fromCharCode(65+q.correct)} — ${q.options[q.correct].en} / ${q.options[q.correct].hi}</p><p>📚 Why? ${q.exp_en}</p><p>${q.exp_hi}</p>${tipHtml}</div>`;
  }else{
    const timeUp=choice===-1;
    const yours=timeUp?"":`<p>❎ Your Answer: ${String.fromCharCode(65+choice)} — ${q.options[choice].en} / ${q.options[choice].hi} — this is not correct.</p>`;
    resultBox.innerHTML=`<div class="result bad"><h3>${timeUp?"⏰ TIME'S UP!":"❌ NOT QUITE!"}</h3>
      <p>🏆 Correct Answer: ${String.fromCharCode(65+q.correct)} — ${q.options[q.correct].en} / ${q.options[q.correct].hi}</p>${yours}
      <p>📚 Why? ${q.exp_en}</p>
      <p>${q.exp_hi}</p>${tipHtml}</div>`;
  }
  document.getElementById('nextRow').style.display='block';
  document.getElementById('nextBtn').onclick=()=>{
    state.idx++;
    if(state.idx%10===0 && state.idx>0){
      showScoreboard(state.idx>=QUESTIONS.length);
    }else{
      renderQuestion();
    }
  };
}

function showScoreboard(isLast){
  const total=state.correctCount+state.wrongCount;
  const acc=total>0?Math.round((state.correctCount/total)*100):0;
  let comment;
  if(acc>=85)comment="🔥 You're on fire! Keep the momentum going!";
  else if(acc>=60)comment="⚡ Solid performance! A little more focus and you'll ace it!";
  else if(acc>=40)comment="💪 The traps are getting you—time to fight back!";
  else comment="📘 Don't worry, every topper started somewhere. Keep pushing!";
  const overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML=`
    <div class="board">
      <h2>🏆 QUIZ SCOREBOARD</h2>
      <div class="stat"><span>✅ Correct:</span><b>${state.correctCount}</b></div>
      <div class="stat"><span>❌ Incorrect:</span><b>${state.wrongCount}</b></div>
      <div class="stat"><span>🎯 Accuracy:</span><b>${acc}%</b></div>
      <div class="comment">${comment}</div>
      <button class="btn" id="continueBtn">${isLast?"See Final Result 🏁":"Continue ➡️"}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('continueBtn').onclick=()=>{
    overlay.remove();
    if(isLast){renderFinal();}else{renderQuestion();}
  };
}

function renderFinal(){
  const total=state.correctCount+state.wrongCount;
  const acc=total>0?Math.round((state.correctCount/total)*100):0;
  let grade;
  if(acc>=85)grade="🏆 TOPPER";
  else if(acc>=65)grade="🥈 STRONG";
  else if(acc>=40)grade="🥉 GROWING";
  else grade="📘 KEEP GOING";
  app.innerHTML=`
    <div class="hero">
      <h1>${grade}</h1>
      <p>${state.name}, here's your final performance!</p>
    </div>
    <div class="card center">
      <div class="stat" style="font-size:18px;margin:10px 0;">🏅 Final Score: <b>${state.score}</b></div>
      <div class="stat" style="font-size:16px;margin:10px 0;">✅ Correct: ${state.correctCount} &nbsp; ❌ Incorrect: ${state.wrongCount}</div>
      <div class="stat" style="font-size:16px;margin:10px 0;">🎯 Accuracy: ${acc}%</div>
      <button class="btn" id="restartBtn">🔄 Restart Quiz / फिर से शुरू करें</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick=()=>{
    state.idx=0;state.score=0;state.correctCount=0;state.wrongCount=0;
    renderStart();
  };
}

renderStart();

</script>
</body>
</html>
